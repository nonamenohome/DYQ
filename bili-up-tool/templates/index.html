<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B站 UP 主视频看板</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    background: #f0f2f5;
    color: #1f2937;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
  }
  h1 { font-size: 18px; margin: 0; }

  /* 顶部状态条 */
  .topbar {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    padding: 16px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 20px;
    margin-bottom: 16px;
  }
  .topbar .up-name { font-size: 18px; font-weight: 600; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat .k { color: #8a93a5; font-size: 12px; }
  .stat .v { font-weight: 600; }
  .topbar .spacer { flex: 1; }

  .btn {
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    background: #4361ee;
    color: #fff;
  }
  .btn:hover { background: #3550d8; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.ghost { background: #eef1f6; color: #1f2937; }
  .btn.ghost:hover { background: #e2e6ee; }
  .btn.sm { padding: 5px 12px; font-size: 13px; }

  /* 筛选栏 */
  .filters {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    padding: 12px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 16px;
  }
  .filters input[type=search], .filters select {
    border: 1px solid #d7dbe3;
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: inherit;
  }
  .filters input[type=search] { flex: 1; min-width: 200px; }
  .filters input[type=search]:focus, .filters select:focus {
    outline: none; border-color: #4361ee;
  }

  /* 错误提示 */
  .error {
    background: #fdecec;
    border: 1px solid #f5c2c2;
    color: #b42318;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 16px;
  }
  .error[hidden] { display: none; }

  /* 视频卡片列表 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .cover {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #e6e9ef;
    display: block;
    object-fit: cover;
  }
  .card-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .title {
    font-weight: 600;
    line-height: 1.4;
    max-height: 2.8em;
    overflow: hidden;
  }
  .meta { color: #8a93a5; font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; }
  .card-foot {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .badge {
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.pending     { background: #fff4e5; color: #b76e00; }
  .badge.downloading { background: #e7efff; color: #4361ee; }
  .badge.done        { background: #e6f6ec; color: #1a7f4b; }
  .badge.failed      { background: #fdecec; color: #b42318; }
  .badge.unknown     { background: #eef1f6; color: #8a93a5; }

  /* 进度条 */
  .progress { flex: 1; min-width: 100px; }
  .progress .bar { height: 6px; background: #e6e9ef; border-radius: 3px; overflow: hidden; }
  .progress .fill { height: 100%; background: #4361ee; width: 0; transition: width .3s; }
  .progress .txt { font-size: 12px; color: #8a93a5; margin-top: 3px; }

  .file-path {
    font-size: 12px;
    color: #8a93a5;
    word-break: break-all;
    background: #f7f8fa;
    border-radius: 4px;
    padding: 4px 6px;
  }

  .empty {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    padding: 60px 20px;
    text-align: center;
    color: #8a93a5;
  }
  .empty[hidden] { display: none; }
</style>
</head>
<body>

<!-- 顶部状态条 -->
<header class="topbar">
  <div>
    <h1 id="upName">B站 UP 主视频看板</h1>
  </div>
  <div class="stat"><span class="k">视频总数</span><span class="v" id="statCount">-</span></div>
  <div class="stat"><span class="k">上次检查</span><span class="v" id="statLast">-</span></div>
  <div class="stat"><span class="k">下次检查</span><span class="v" id="statNext">-</span></div>
  <div class="stat"><span class="k">当前下载</span><span class="v" id="statDl">-</span></div>
  <div class="stat"><span class="k">轮询</span><span class="v" id="statPoller">-</span></div>
  <div class="spacer"></div>
  <button class="btn" id="btnRefresh">立即检查新投稿</button>
</header>

<!-- 筛选栏 -->
<div class="filters">
  <input type="search" id="fSearch" placeholder="搜索标题…" autocomplete="off">
  <select id="fStatus">
    <option value="all">全部状态</option>
    <option value="pending">待下载</option>
    <option value="downloading">下载中</option>
    <option value="done">已完成</option>
    <option value="failed">失败</option>
  </select>
  <select id="fOrder">
    <option value="pubdate_desc">最新在前</option>
    <option value="pubdate_asc">最早在前</option>
  </select>
</div>

<!-- 错误提示 -->
<div class="error" id="errBox" hidden></div>

<!-- 视频列表 -->
<main class="grid" id="list"></main>

<!-- 空态 -->
<div class="empty" id="empty" hidden>还没有抓到视频，点上方按钮检查</div>

<script src="/static/app.js"></script>
</body>
</html>
